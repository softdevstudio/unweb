<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Unweb</title>
  <style>
    body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: #1e293b; background: #f8fafc; }
    main { max-width: 560px; margin: 80px auto; padding: 0 20px; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #475569; }
  </style>
</head>
<body>
  <main>
    <h1>A new stranger</h1>
    <p>This window starts with no history, no logins and no cookies. When you close it, everything it collected is deleted.</p>
    <p>Start Unweb with an address to open a site in it, for example <code>unweb example.com</code>.</p>
  </main>
</body>
</html>
