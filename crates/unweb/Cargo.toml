[package]
name = "unweb"
description = "A tiny browser where every visit is a first visit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "unweb"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# "unstable" enables two webviews in one window (the bar and the page).
tauri = { version = "2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Same GTK and WebKitGTK as Tauri, to clear a stranger's engine data
# before its folder is deleted and to keep passwords out of the keyring.
gtk = "0.18"
webkit2gtk = { version = "2", features = ["v2_16", "v2_30"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Native back and forward (see nav.rs).
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3.2", features = ["std", "objc2-app-kit", "WKWebView", "WKNavigation"] }
