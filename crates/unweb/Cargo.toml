[package]
name = "unweb"
description = "A tiny browser where every visit is a first visit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "unweb"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Same GTK and WebKitGTK as Tauri, to clear a stranger's engine data
# before its folder is deleted.
gtk = "0.18"
webkit2gtk = { version = "2", features = ["v2_16"] }
