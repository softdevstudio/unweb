name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Linux web engine and build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The HSTS check needs a certificate the web engine trusts. The runner
      # is thrown away after the job, so trusting a test authority here is
      # harmless; never do this on a machine you keep.
      - name: Test certificate for the HSTS check
        run: |
          bash scripts/test-ca.sh "$RUNNER_TEMP/unweb-tls" 2> "$RUNNER_TEMP/ca.err" || {
            echo "::error title=test certificate::$(tr '\n' ' ' < "$RUNNER_TEMP/ca.err")"; exit 1; }
          echo "UNWEB_TEST_TLS=$RUNNER_TEMP/unweb-tls" >> "$GITHUB_ENV"
      - run: bash scripts/record-results.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: test/results/
